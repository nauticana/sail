<div class="portal-button">
  <button matButton="elevated" class="primary" type="button"
          [disabled]="loading()"
          (click)="openPortal()">
    @if (loading()) { Opening… } @else { {{ label() }} }
  </button>
  @if (errorMessage()) {
    <div class="auth-error" role="alert">{{ errorMessage() }}</div>
  }
</div>
