<div class="otp-container">
  @if (contact()) {
    <p class="otp-sent-to">We sent a code to</p>
    <p class="otp-contact">{{ contact() }}</p>
  }

  <input class="otp-input-field"
         type="text"
         inputmode="numeric"
         autocomplete="one-time-code"
         [attr.maxlength]="length()"
         [value]="code()"
         (input)="onCodeInput($event)"
         [disabled]="disabled()"
         aria-label="Verification code">

  <div class="otp-digits" aria-hidden="true">
    @for (digit of digits(); track $index) {
      <div class="otp-digit" [class.active]="$index === currentIndex()">
        {{ digit }}
      </div>
    }
  </div>

  <p class="otp-resend" aria-live="polite">
    @if (canResend()) {
      <button matButton class="resend-btn" type="button" (click)="onResend()">Resend code</button>
    } @else {
      Resend code in {{ countdown() }}s
    }
  </p>

  <div class="otp-keypad" role="group" aria-label="Numeric keypad">
    @for (key of keypadKeys; track $index) {
      @if (key === '') {
        <div class="keypad-spacer"></div>
      } @else if (key === 'back') {
        <button matButton class="keypad-key" type="button" (click)="onBackspace()" aria-label="Backspace" [disabled]="disabled()">
          <mat-icon>backspace</mat-icon>
        </button>
      } @else {
        <button matButton class="keypad-key" type="button" (click)="onKeyPress(key)" [disabled]="disabled()">{{ key }}</button>
      }
    }
  </div>
</div>
