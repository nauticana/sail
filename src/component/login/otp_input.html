<div class="otp-container">
  @if (contact()) {
    <p class="otp-sent-to">We sent a code to</p>
    <p class="otp-contact">{{ contact() }}</p>
  }

  <div class="otp-digits" role="group" aria-label="Verification code">
    @for (digit of digits(); track $index) {
      <div class="otp-digit"
           [class.active]="$index === currentIndex()"
           [attr.aria-label]="'Digit ' + ($index + 1)">
        {{ digit }}
      </div>
    }
  </div>

  <p class="otp-resend">
    @if (canResend()) {
      <button mat-button class="resend-btn" type="button" (click)="onResend()">Resend code</button>
    } @else {
      Resend code in {{ countdown() }}s
    }
  </p>

  <div class="otp-keypad" role="group" aria-label="Numeric keypad">
    @for (key of keypadKeys; track $index) {
      @if (key === '') {
        <div class="keypad-spacer"></div>
      } @else if (key === 'back') {
        <button mat-button class="keypad-key" type="button" (click)="onBackspace()" aria-label="Backspace" [disabled]="disabled()">
          <mat-icon>backspace</mat-icon>
        </button>
      } @else {
        <button mat-button class="keypad-key" type="button" (click)="onKeyPress(key)" [disabled]="disabled()">{{ key }}</button>
      }
    }
  </div>
</div>
