<h1 mat-dialog-title class="table-form-title">
    <span class="table-form-title-text">
        @if (isNew) {
            New {{ getCaption() }} Record
        } @else {
            {{ getCaption() }} Details
        }
    </span>
    <button matIconButton type="button" (click)="onCancel()" aria-label="Close dialog" class="table-form-close">
        <mat-icon>close</mat-icon>
    </button>
</h1>
<div mat-dialog-content>
    <sail-record-form [tableName]="tableName()" [record]="editableRecord" [isReadOnly]="isReadOnlyBound"></sail-record-form>
</div>
<div mat-dialog-actions align="end">
    <button matButton="elevated" class="primary" type="submit" (click)="onSave()">Save</button>
    <button matButton type="button" (click)="onCancel()">Cancel</button>
</div>
