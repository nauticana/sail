<div class="form-container">
    @for (key of computedFields(); track key) {
        @if (!isArray(working()[key])) {
            <sail-dynamic-field
             [tableName]="tableName()"
             [value]="working()[key]"
             (valueChange)="onFieldChange(key, $event)"
             (recordUpdate)="onRecordUpdate($event)"
             [field]="key"
             [readonly]="isReadOnly()(key)">
            </sail-dynamic-field>
        }
    }
</div>
