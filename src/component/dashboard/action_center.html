<section class="action-center">
  @if (heading()) { <h2 class="action-center-title">{{ heading() }}</h2> }
  @if (sorted().length === 0) {
    <p class="action-center-empty">{{ emptyMessage() }}</p>
  } @else {
    <ul class="action-center-list">
      @for (a of sorted(); track a.id) {
        <li class="action-item" [class.action-done]="a.done" [attr.data-priority]="a.priority ?? 0">
          <div class="action-body">
            <span class="action-title">{{ a.title }}</span>
            <span class="action-reason">{{ a.reason }}</span>
          </div>
          @if (a.done) {
            <span class="action-complete">
              <mat-icon aria-hidden="true">check_circle</mat-icon><span class="sr-only">Done</span>
            </span>
          } @else {
            <button matButton="elevated" type="button" class="primary" (click)="act.emit(a)">{{ a.ctaLabel }}</button>
          }
        </li>
      }
    </ul>
  }
</section>
