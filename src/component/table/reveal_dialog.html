<h2 mat-dialog-title>Copy now</h2>
<mat-dialog-content>
    <p>This won't be shown again.</p>
    @for (entry of entries; track entry[0]) {
        <p style="margin:12px 0 2px; font-size:12px; opacity:0.7;">{{ entry[0] }}</p>
        <div style="display:flex; align-items:center; gap:8px;">
            <code style="flex:1; word-break:break-all;">{{ entry[1] }}</code>
            <button matIconButton (click)="copy(entry[1])" [attr.aria-label]="'Copy ' + entry[0]">
                <mat-icon>content_copy</mat-icon>
            </button>
        </div>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button matButton mat-dialog-close>Done</button>
</mat-dialog-actions>
