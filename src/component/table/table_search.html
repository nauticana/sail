<h1>
    @if (title()) {
        {{ title() }}
    } @else {
        {{ getCaption() }} Search
    }
</h1>
<div class="page-container">
    <sail-record-form [tableName]="tableName()" [record]="editableRecord()" (recordChange)="editableRecord.set($event)" [fields]="searchColumns()" [isReadOnly]="isReadOnlyFn()"></sail-record-form>
</div>
<div class="search-actions">
    <button matButton="elevated" class="primary" (click)="onSearch()">Search</button>
    <button matButton (click)="onClear()">Clear</button>
    @if (canCreate()) {
        <button matButton="elevated" class="accent" (click)="onAddRecord()">New Record</button>
    }
    @for (action of tableActions(); track action.action) {
        @if (canExecuteAction(action)) {
            <button matButton="outlined" type="button"
                    [title]="action.caption"
                    (click)="executeAction(action)">
                @if (action.icon) { <mat-icon>{{ action.icon }}</mat-icon> }
                {{ action.caption }}
            </button>
        }
    }
</div>
